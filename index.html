<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Tracker Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">
        <h1>Financial Dashboard</h1>

        <div class="summary">
            <div class="card">
                <h3>Total Salary</h3>
                <p id="display-salary">$0</p>
            </div>
            <div class="card">
                <h3>Total Expenses</h3>
                <p id="display-expenses">$0</p>
            </div>
            <div class="card balance">
                <h3>Remaining Balance</h3>
                <p id="display-balance">$0</p>
            </div>
        </div>

        <section class="controls">
            <div class="input-group">
                <label>Set Monthly Salary</label>
                <input type="number" id="salary-input" placeholder="Enter salary...">
            </div>

            <hr>

            <div class="input-group">
                <label>Add New Expense</label>
                <input type="text" id="expense-name" placeholder="Rent, Groceries, etc.">
                <input type="number" id="expense-amount" placeholder="Amount">
                <button id="add-expense-btn">Add Expense</button>
            </div>
        </section>

        <section class="history">
            <h3>Expense List</h3>
            <ul id="expense-list">
                </ul>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
